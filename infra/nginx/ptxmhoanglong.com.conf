server {
    listen 80;
    listen [::]:80;
    server_name ptxmhoanglong.com www.ptxmhoanglong.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ptxmhoanglong.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ptxmhoanglong.com www.ptxmhoanglong.com;

    ssl_certificate /etc/letsencrypt/live/ptxmhoanglong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ptxmhoanglong.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 10m;

    if ($host = www.ptxmhoanglong.com) {
        return 301 https://ptxmhoanglong.com$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
